<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Tube Player</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TubePlayer">
  <meta name="theme-color" content="#0f0f0f">
  
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png">

  <script>
    const manifest = {
      "name": "Tube Player",
      "short_name": "TubePlayer",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#0f0f0f",
      "theme_color": "#0f0f0f",
      "icons": [{ "src": "https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png", "sizes": "512x512", "type": "image/png" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Sans-Serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f0f0f; color: #fff; padding-bottom: 90px; }
    header { position: sticky; top: 0; z-index: 100; background-color: #0f0f0f; padding: 12px 16px; border-bottom: 1px solid #272727; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #222; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 20px; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #ff0000; }
    button.btn-search { background: #ff0000; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    .section-title { font-size: 15px; font-weight: bold; margin: 16px 16px 8px 16px; color: #aaa; }
    .history-chips { display: flex; gap: 8px; padding: 0 16px 12px 16px; overflow-x: auto; scrollbar-width: none; }
    .history-chips::-webkit-scrollbar { display: none; }
    .chip { background: #272727; color: #eee; padding: 6px 14px; border-radius: 16px; font-size: 13px; white-space: nowrap; cursor: pointer; border: 1px solid #3d3d3d; }
    
    .video-grid { display: flex; flex-direction: column; gap: 12px; padding: 0 16px; }
    .video-card { display: flex; gap: 12px; cursor: pointer; background: #181818; padding: 8px; border-radius: 10px; align-items: center; }
    .video-card:active { background: #282828; }
    .video-thumb { width: 120px; height: 68px; border-radius: 6px; object-fit: cover; background: #333; flex-shrink: 0; }
    .video-info { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
    .video-title { font-size: 14px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #fff; }
    .video-channel { font-size: 12px; color: #aaa; margin-top: 4px; }
    
    .error-box { background: #3a0d0d; border: 1px solid #f44336; color: #ffcdd2; padding: 12px; border-radius: 8px; font-size: 13px; margin: 16px; line-height: 1.4; word-break: break-word; }

    /* Player Bar cố định phía dưới */
    .player-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #212121; border-top: 1px solid #333; display: flex; align-items: center; padding: 0 12px; gap: 12px; z-index: 1000; }
    .player-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
    .player-details { flex: 1; overflow: hidden; }
    .player-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
    .btn-play { background: #ff0000; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

    .player-section { margin: 12px 16px 16px; }
    .player-frame { width: 100%; max-width: 720px; min-height: 200px; aspect-ratio: 16 / 9; margin: 0 auto; background: #000; border-radius: 10px; overflow: hidden; }
    #ytplayer-container { width: 100%; height: 100%; min-height: 200px; }
    #ytplayer-container iframe { width: 100% !important; height: 100% !important; min-height: 200px; display: block; border: 0; }
    .player-actions { display: flex; justify-content: flex-end; margin: 8px auto 0; max-width: 720px; }
    .open-youtube { display: inline-block; background: #272727; color: #fff; border: 1px solid #444; border-radius: 18px; padding: 8px 13px; font-size: 13px; text-decoration: none; }
    .open-youtube:active { background: #3a3a3a; }
  </style>
</head>
<body>

  <header>
    <input type="text" id="searchInput" placeholder="Tìm kiếm bài hát, video..." onkeypress="handleKeyPress(event)">
    <button class="btn-search" onclick="executeSearch()">Tìm</button>
  </header>

  <!-- Trình phát YouTube phải hiển thị trên trang; không hỗ trợ phát nền bằng API -->
  <section class="player-section" aria-label="Trình phát YouTube">
    <div class="player-frame">
      <div id="ytplayer-container" aria-label="YouTube player"></div>
      <div id="playerPlaceholder" style="min-height:200px;display:flex;align-items:center;justify-content:center;color:#aaa;text-align:center;padding:20px;">
        Chọn một video bên dưới để phát
      </div>
    </div>
    <div class="player-actions">
      <a id="openYoutubeBtn" class="open-youtube" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">Mở trong YouTube</a>
    </div>
  </section>

  <div id="historySection" style="display:none;">
    <div class="section-title">🔍 Tìm kiếm gần đây</div>
    <div class="history-chips" id="historyChips"></div>
  </div>

  <div class="section-title" id="gridTitle">🔥 Kết quả tìm kiếm</div>
  <div id="errorDisplay"></div>
  <div class="video-grid" id="videoGrid"></div>

  <!-- Player Bar -->
  <div class="player-bar" id="playerBar" style="display: none;">
    <img id="pThumb" class="player-thumb" src="" alt="">
    <div class="player-details">
      <div id="pTitle" class="player-title">Đang tải...</div>
      <div id="pSub" class="player-sub">Đang phát trong ứng dụng</div>
    </div>
    <button class="btn-play" id="playBtn" onclick="togglePlay()">▶</button>
  </div>

  <script>
    // Dán YouTube Data API v3 Key vào giữa hai dấu nháy đơn bên dưới.
    const DEFAULT_API_KEY = 'AIzaSyAc0rtaQga_-CdRwkltei5rBX-GQqyZLt8';

    let player = null;
    let isPlaying = false;
    let currentVideo = null;
    let youtubeApiReady = false;

    const urlParams = new URLSearchParams(window.location.search);
    const apiKey = urlParams.get('key') || DEFAULT_API_KEY;

    // IFrame API gọi hàm này khi thư viện YouTube đã tải xong.
    // Chỉ tạo iframe sau khi người dùng chọn video để có thể gắn
    // referrerpolicy TRƯỚC KHI iframe gửi yêu cầu đầu tiên tới YouTube.
    function onYouTubeIframeAPIReady() {
      youtubeApiReady = true;
      if (currentVideo) createYouTubePlayer(currentVideo);
    }

    function createYouTubePlayer(video) {
      const container = document.getElementById('ytplayer-container');
      const placeholder = document.getElementById('playerPlaceholder');

      if (player && typeof player.destroy === 'function') {
        try { player.destroy(); } catch (e) {}
        player = null;
      }

      // Tạo iframe thủ công: referrerpolicy được đặt trước src và trước khi gắn vào DOM.
      const iframe = document.createElement('iframe');
      iframe.id = 'ytplayer';
      iframe.title = 'YouTube video player';
      iframe.width = '640';
      iframe.height = '360';
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      iframe.referrerPolicy = 'strict-origin-when-cross-origin';

      const embedParams = new URLSearchParams({
        enablejsapi: '1',
        origin: window.location.origin,
        autoplay: '1',
        playsinline: '1',
        controls: '1',
        rel: '0'
      });
      iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(video.id)}?${embedParams.toString()}`;

      container.replaceChildren(iframe);
      placeholder.style.display = 'none';

      // Gắn API vào iframe đã có src và referrerpolicy từ trước.
      player = new YT.Player(iframe, {
        events: {
          onReady: () => {
            isPlaying = true;
            document.getElementById('playBtn').innerText = '❚❚';
            document.getElementById('pSub').innerText = video.channel;
          },
          onStateChange: onPlayerStateChange,
          onError: (event) => {
            isPlaying = false;
            document.getElementById('playBtn').innerText = '▶';
            if (event.data === 153) {
              showError('YouTube vẫn không nhận được HTTP Referer. Hãy mở link GitHub Pages trực tiếp bằng Safari/Chrome (không mở file HTML hoặc cửa sổ xem trước). Nếu đang mở từ biểu tượng màn hình chính, hãy thử mở cùng link trong Safari/Chrome để kiểm tra.');
            } else {
              showError('YouTube không thể phát video này (mã lỗi ' + event.data + '). Video có thể bị giới hạn nhúng hoặc không khả dụng. Hãy thử video khác hoặc chọn “Mở trong YouTube”.');
            }
          }
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('playBtn').innerText = '❚❚';
        document.getElementById('pSub').innerText = currentVideo ? currentVideo.channel : 'Đang phát';
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        document.getElementById('playBtn').innerText = '▶';
        document.getElementById('pSub').innerText = event.data === YT.PlayerState.ENDED ? 'Đã phát hết' : 'Đã tạm dừng';
      }
    }

    function togglePlay() {
      if (!player || !player.playVideo || !player.pauseVideo) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function playVideo(id, title, channel, thumb) {
      currentVideo = { id, title, channel, thumb };
      document.getElementById('playerBar').style.display = 'flex';
      document.getElementById('pTitle').innerText = title;
      document.getElementById('pSub').innerText = 'Đang tải trình phát...';
      document.getElementById('pThumb').src = thumb;
      document.getElementById('openYoutubeBtn').href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(id);
      document.querySelector('.player-section').scrollIntoView({ behavior: 'smooth', block: 'start' });

      if (youtubeApiReady) {
        createYouTubePlayer(currentVideo);
      } else {
        showError('Đang tải trình phát YouTube... Hệ thống sẽ tự khởi tạo khi tải xong.');
      }
    }

    async function searchYouTube(query) {
      document.getElementById('errorDisplay').innerHTML = '';
      
      if (!apiKey || apiKey === 'ĐIỀN_API_KEY_CỦA_BẠN_VÀO_ĐÂY') {
        showError('Chưa có API Key! Vui lòng điền API Key vào mã nguồn.');
        return;
      }

      saveSearchHistory(query);
      renderHistory();

      document.getElementById('gridTitle').innerText = `Kết quả cho: "${query}"`;
      document.getElementById('videoGrid').innerHTML = '<div style="color:#aaa;text-align:center;padding:30px;">Đang tìm kiếm...</div>';

      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&key=${apiKey}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok || data.error) {
          const apiError = data.error || { code: res.status, message: res.statusText };
          showError(`Lỗi Google API (${apiError.code}): ${apiError.message}`);
          document.getElementById('videoGrid').innerHTML = '';
          return;
        }

        renderVideos(data.items);
      } catch (err) {
        showError('Lỗi kết nối mạng!');
      }
    }

    function showError(msg) {
      document.getElementById('errorDisplay').innerHTML = `<div class="error-box">⚠️ <b>Thông báo:</b> ${msg}</div>`;
    }

    function renderVideos(items) {
      const container = document.getElementById('videoGrid');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerHTML = '<div style="color:#aaa;text-align:center;padding:20px;">Không tìm thấy video nào</div>';
        return;
      }

      items.forEach(item => {
        const videoId = item.id.videoId;
        const title = item.snippet.title;
        const channel = item.snippet.channelTitle;
        const thumb = item.snippet.thumbnails.medium.url;

        const card = document.createElement('div');
        card.className = 'video-card';
        card.addEventListener('click', () => playVideo(videoId, title, channel, thumb));

        const image = document.createElement('img');
        image.className = 'video-thumb';
        image.src = thumb;
        image.alt = '';
        image.loading = 'lazy';

        const info = document.createElement('div');
        info.className = 'video-info';
        const titleNode = document.createElement('div');
        titleNode.className = 'video-title';
        titleNode.textContent = title;
        const channelNode = document.createElement('div');
        channelNode.className = 'video-channel';
        channelNode.textContent = channel;

        info.append(titleNode, channelNode);
        card.append(image, info);
        container.appendChild(card);
      });
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') executeSearch();
    }

    function executeSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (q) searchYouTube(q);
    }

    function getHistory() {
      return JSON.parse(localStorage.getItem('yt_search_history') || '[]');
    }

    function saveSearchHistory(q) {
      let history = getHistory().filter(item => item.toLowerCase() !== q.toLowerCase());
      history.unshift(q);
      if (history.length > 8) history = history.slice(0, 8);
      localStorage.setItem('yt_search_history', JSON.stringify(history));
    }

    function renderHistory() {
      const history = getHistory();
      const section = document.getElementById('historySection');
      const container = document.getElementById('historyChips');

      if (history.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      container.innerHTML = '';
      history.forEach(term => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerText = term;
        chip.onclick = () => {
          document.getElementById('searchInput').value = term;
          searchYouTube(term);
        };
        container.appendChild(chip);
      });
    }

    window.onload = () => {
      renderHistory();
      const history = getHistory();
      const defaultQuery = history.length > 0 ? history[0] : 'Nhạc lofi chill thư giãn';
      document.getElementById('searchInput').value = defaultQuery;
      searchYouTube(defaultQuery);
    };

  </script>
  <script async src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
